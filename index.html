<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calorie Log</title>
<meta name="description" content="A calm calorie tracker with a barcode scanner, easy weekly meal plans and grocery lists.">
<meta name="theme-color" content="#0D7466">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calories">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="app" id="app">
  <div class="screen" id="screen-today"></div>
  <div class="screen" id="screen-plan" hidden></div>
  <div class="screen" id="screen-progress" hidden></div>
  <div class="screen" id="screen-me" hidden></div>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="in">
    <button type="button" data-tab="today" aria-current="page"><span class="ti"><svg class="i"><use href="#i-sun"/></svg></span>Today</button>
    <button type="button" data-tab="plan"><span class="ti"><svg class="i"><use href="#i-book"/></svg></span>Meals</button>
    <button type="button" class="plus" id="fab" aria-label="Add food"><svg class="i"><use href="#i-plus"/></svg></button>
    <button type="button" data-tab="progress"><span class="ti"><svg class="i"><use href="#i-chart"/></svg></span>Progress</button>
    <button type="button" data-tab="me"><span class="ti"><svg class="i"><use href="#i-user"/></svg></span>Me</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sh"><h2 id="sheetTitle"></h2><button type="button" class="iconbtn ghost" id="sheetClose" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="sb" id="sheetBody"></div>
  <div class="sf" id="sheetFoot" hidden></div>
</section>

<section class="scanner" id="scanner" hidden aria-label="Barcode scanner">
  <video id="scanVideo" autoplay muted playsinline></video>
  <div class="top">
    <button type="button" class="iconbtn" id="scanClose" aria-label="Close scanner"><svg class="i"><use href="#i-x"/></svg></button>
    <b>Scan a barcode</b>
    <button type="button" class="iconbtn" id="scanTorch" aria-label="Flashlight" hidden><svg class="i"><use href="#i-bolt"/></svg></button>
  </div>
  <div class="reticle" id="scanReticle"></div>
  <div class="errbox" id="scanErr" hidden></div>
  <div class="bottom">
    <div class="status" id="scanStatus" aria-live="polite">Starting the camera…</div>
    <form class="manual" id="scanManual">
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="scanCode" placeholder="Or type the barcode numbers" aria-label="Barcode number" autocomplete="off">
      <button class="btn" type="submit">Look up</button>
    </form>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>Undo</button></div>

<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="importInput" accept="application/json,.json,text/plain" hidden>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M9 7h7M9 11h5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M17 8v8"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6-4-9-1 2-2 3-3 3 0-2-1-5-3-7 0 4-4 7-4 13 0 4.3 3 7 7 7z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></symbol>

    <symbol id="i-pot" viewBox="0 0 24 24"><path d="M4 10h16v7a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path d="M2 10h20M9 6c0-1 1-1 1-2M14 6c0-1 1-1 1-2"/></symbol>
    <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7c-1.5-1-5-1.5-6.5 1.5S5 16 7 19s3.5 2.5 5 1.5c1.5 1 3 1.5 5-1.5s2-7.5.5-10.5S13.5 6 12 7z"/><path d="M12 7c0-2 1-4 3-4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
  </defs>
</svg>

<script src="js/util.js"></script>
<script src="js/store.js"></script>
<script src="js/foods.js"></script>

<script src="js/recipes.js"></script>
<script src="js/recipes-popular.js"></script>
<script src="js/plan-math.js"></script>
<script src="js/planner.js"></script>
<script src="js/foodapi.js"></script>
<script src="js/scanner.js"></script>
<script src="js/claude.js"></script>
<script src="js/ui.js"></script>

<script src="js/addfood.js"></script>
<script src="js/plan-ui.js"></script>

</body>
</html>
